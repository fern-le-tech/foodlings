<!--
  Sign-up confirmation email. Simple single-button email — click confirms
  the account and deep-links straight back into the app (foodlings://confirmed,
  see RootNavigator.tsx's Linking listener), which then shows an in-app
  "Email confirmed!" notice.
-->
<div style="background-color:#FBF3E7; padding:32px 16px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:420px; margin:0 auto;">
    <tr>
      <td style="background-color:#FFFFFF; border:1px solid #EAE0D2; border-radius:16px; padding:32px 28px; text-align:center;">
        <p style="margin:0 0 4px; font-size:12px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#D8342B;">
          Foodlings
        </p>
        <h1 style="margin:0 0 16px; font-size:20px; color:#2B2320;">
          Confirm your email
        </h1>
        <p style="margin:0 0 24px; font-size:14px; line-height:1.5; color:#7A6F63;">
          Tap the button below to confirm your account and jump back into the app.
        </p>
        <a href="{{ .ConfirmationURL }}"
           style="display:inline-block; background-color:#D8342B; color:#FFFFFF; text-decoration:none; font-size:15px; font-weight:700; padding:14px 32px; border-radius:999px;">
          Confirm email
        </a>
        <p style="margin:24px 0 0; font-size:12px; line-height:1.5; color:#B8AEA0;">
          Didn't create a Foodlings account? You can safely ignore this email.
        </p>
      </td>
    </tr>
  </table>
</div>
