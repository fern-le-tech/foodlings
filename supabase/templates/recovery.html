<!--
  Password reset email. Deliberately has NO link/button — the app's
  OnboardingScreen reset flow expects the person to type a 6-digit code
  back in (see src/screens/OnboardingScreen.tsx), not tap through to a
  hosted page this project doesn't have. {{ .Token }} is required for the
  code to actually be included; the default Supabase template uses
  {{ .ConfirmationURL }} instead, which is why this needed replacing.
-->
<div style="background-color:#FBF3E7; padding:32px 16px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:420px; margin:0 auto;">
    <tr>
      <td style="background-color:#FFFFFF; border:1px solid #EAE0D2; border-radius:16px; padding:32px 28px; text-align:center;">
        <p style="margin:0 0 4px; font-size:12px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#D8342B;">
          Foodlings
        </p>
        <h1 style="margin:0 0 16px; font-size:20px; color:#2B2320;">
          Reset your password
        </h1>
        <p style="margin:0 0 20px; font-size:14px; line-height:1.5; color:#7A6F63;">
          Enter this code in the app to choose a new password.
        </p>
        <div style="background-color:#F3ECE0; border-radius:10px; padding:16px; margin-bottom:20px;">
          <span style="font-family:'Courier New',Courier,monospace; font-size:32px; font-weight:700; letter-spacing:6px; color:#2B2320;">
            {{ .Token }}
          </span>
        </div>
        <p style="margin:0; font-size:12px; line-height:1.5; color:#B8AEA0;">
          Didn't request this? You can safely ignore this email — your password won't change.
        </p>
      </td>
    </tr>
  </table>
</div>
